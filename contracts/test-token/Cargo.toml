[package]
name = "test-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# NEP-141 token used only by the sandbox tests. Anyone can mint.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
